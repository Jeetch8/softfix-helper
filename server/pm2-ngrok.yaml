apps:
  - name: 'my-app'
    script: 'server.js' # Replace 'server.js' with your application's start script
    node_args: '--max-old-space-size=4096'
    watch: true
    ignore_watch:
      - 'node_modules'
      - 'temp'
      - 'temp/**'
      - 'uploads'
      - 'uploads/**'
      - '*.log'
      - 'tmpfile'
